<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;min-height:100vh;overflow-x:hidden}
        body{background:#0f1923;font-family:'Segoe UI',Arial,sans-serif;color:#fff;position:relative;padding-top:60px}
        body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 20% 50%,rgba(30,80,160,0.25) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(0,150,200,0.15) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(60,40,120,0.2) 0%,transparent 50%);pointer-events:none;z-index:0}
        .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
        .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:0}
        @keyframes twinkle{0%{opacity:0.1;transform:scale(0.8)}100%{opacity:var(--o);transform:scale(1)}}
        .main-wrap{position:relative;z-index:2;width:100%;max-width:600px;margin:0 auto;padding:20px;text-align:center}
        .admin-title{font-size:20px;letter-spacing:8px;color:rgba(255,255,255,0.85);text-shadow:0 0 20px rgba(79,195,247,0.35);margin-bottom:6px}
        .admin-sub{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.3);margin-bottom:30px}
        .admin-buttons{display:flex;justify-content:center;gap:50px;margin:30px 0}
        .admin-btn{padding:22px 46px;font-size:20px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#4fc3f7;border:1px solid rgba(79,195,247,0.3);border-radius:16px;cursor:pointer;font-weight:bold;letter-spacing:2px;box-shadow:0 8px 40px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08);transition:all .25s}
        .admin-btn:hover{background:rgba(79,195,247,0.15);transform:translateY(-2px);box-shadow:0 12px 48px rgba(0,0,0,0.4),0 0 24px rgba(79,195,247,0.25)}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:1000}
        .modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a2332;padding:30px;border-radius:12px;min-width:350px;max-width:90%;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        .modal h2{margin-top:0;font-size:18px;color:#4fc3f7;font-weight:400}
        .modal h3{margin:15px 0 5px;font-size:14px;color:rgba(255,255,255,0.6)}
        .modal p{font-size:13px;color:rgba(255,255,255,0.5)}
        .modal textarea{width:100%;height:200px;margin:10px 0;padding:10px;font-size:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;box-sizing:border-box}
        .modal textarea:focus{outline:none;border-color:rgba(100,180,255,0.4)}
        .modal input[type=password]{padding:8px;font-size:14px;width:200px;margin:10px 0;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.15);outline:none;color:#fff;text-align:center;letter-spacing:4px;box-sizing:border-box}
        .modal input[type=password]:focus{border-bottom-color:rgba(100,180,255,0.5)}
        .modal input[type=password]::placeholder{color:rgba(255,255,255,0.25)}
        .modal button{padding:8px 16px;font-size:14px;margin:5px;border:none;cursor:pointer;border-radius:6px;transition:all .2s}
        .modal .btn-save{background:#4fc3f7;color:#000}.modal .btn-save:hover{background:#81d4fa}
        .modal .btn-cancel{background:rgba(255,255,255,0.1);color:#fff}.modal .btn-cancel:hover{background:rgba(255,255,255,0.2)}
        .modal .btn-confirm{background:#4fc3f7;color:#000}.modal .btn-confirm:hover{background:#81d4fa}
        .modal .btn-clear{background:rgba(255,152,0,0.15);color:#ffb74d;border:1px solid rgba(255,152,0,0.3)}.modal .btn-clear:hover{background:rgba(255,152,0,0.25)}
        .error-msg{color:#ef5350;font-size:14px;margin-top:10px}
        @media(max-width:600px){body{padding-top:30px}.admin-buttons{flex-direction:column;gap:20px}.admin-btn{width:80%;margin:0 auto;padding:18px 30px}.modal{min-width:280px;padding:20px}}
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="main-wrap">
        <div class="admin-title">后台管理</div>
        <div class="admin-sub">ADMIN CONSOLE</div>
        <div class="admin-buttons">
            <button class="admin-btn" onclick="showPasswordPrompt(1)">管理1</button>
            <button class="admin-btn" onclick="showPasswordPrompt(2)">管理2</button>
        </div>
    </div>

    <div id="passwordModal" class="modal-overlay">
        <div class="modal">
            <h2 id="passwordTitle">请输入密码</h2>
            <input type="password" id="passwordInput" placeholder="密码" /><br/>
            <button class="btn-confirm" onclick="checkPassword()">确认</button>
            <button class="btn-cancel" onclick="hidePasswordPrompt()">取消</button>
            <div id="passwordError" class="error-msg"></div>
        </div>
    </div>

    <div id="updateModal" class="modal-overlay">
        <div class="modal">
            <h2 id="updateTitle">更新数组数据</h2>
            <p>请输入新的数组数据（每行一个编号，或用顿号/逗号分隔）：</p>
            <div id="zone1Fields">
                <h3>（上午）</h3>
                <textarea id="inputBackend1" placeholder="每行一个编号"></textarea>
                <button class="btn-clear" onclick="clearBackend(1)">清除 backend1</button>
                <h3>（下午）</h3>
                <textarea id="inputBackend2" placeholder="每行一个编号"></textarea>
                <button class="btn-clear" onclick="clearBackend(2)">清除 backend2</button>
            </div>
            <div id="zone2Fields" style="display:none">
                <h3>（上午）</h3>
                <textarea id="inputBackend3" placeholder="每行一个编号"></textarea>
                <button class="btn-clear" onclick="clearBackend(3)">清除 backend3</button>
                <h3>（下午）</h3>
                <textarea id="inputBackend4" placeholder="每行一个编号"></textarea>
                <button class="btn-clear" onclick="clearBackend(4)">清除 backend4</button>
            </div>
            <button class="btn-save" onclick="saveArray()">保存</button>
            <button class="btn-cancel" onclick="hideUpdateModal()">取消</button>
            <div id="updateMsg" class="error-msg"></div>
            <hr style="margin:20px 0;border:none;border-top:1px solid rgba(255,255,255,0.1)">
            <div style="text-align:left">
                <h3 style="color:rgba(255,255,255,0.7);margin:0 0 8px">修改密码</h3>
                <input type="password" id="newPasswordInput" placeholder="输入新密码" style="width:100%;padding:8px;font-size:14px;box-sizing:border-box;margin:4px 0" />
                <button class="btn-save" onclick="changePassword()">保存密码</button>
                <button class="btn-clear" onclick="resetPassword()">恢复初始密码</button>
                <div id="pwdMsg" class="error-msg"></div>
            </div>
        </div>
    </div>

    <script>
        (function(){var c=document.getElementById('stars');if(!c)return;for(var i=0;i<60;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2+1;s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(Math.random()*3+2)+'s;--o:'+(Math.random()*0.5+0.3)+';animation-delay:'+Math.random()*3+'s';c.appendChild(s);}})();
        var PASSWORD1 = String.fromCharCode(56,56,56,56,56,56,56,56);
        var PASSWORD2 = String.fromCharCode(54,54,54,54,54,54,54,54);
        var currentZone = 0;
        var dataObj = { frontend: [], backend1: [], backend2: [], backend3: [], backend4: [], admin1Pwd: "", admin2Pwd: "" };

        async function loadData() {
            try {
                var resp = await fetch("/api/data");
                if (resp.ok) dataObj = await resp.json();
            } catch(e) {}
        }

        async function saveDataToStorage() {
            await fetch("/api/data", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(dataObj) });
        }

        loadData();

        function showPasswordPrompt(zone) {
            currentZone = zone;
            document.getElementById("passwordModal").style.display = "block";
            document.getElementById("passwordTitle").textContent = "Backend" + zone + " - 请输入密码";
            document.getElementById("passwordInput").value = "";
            document.getElementById("passwordError").textContent = "";
            document.getElementById("passwordInput").focus();
        }

        function hidePasswordPrompt() { document.getElementById("passwordModal").style.display = "none"; }

        function getEffectivePassword(zone) {
            var ls = localStorage.getItem("admin" + zone + "Pwd");
            if (ls && ls.length > 0) return ls;
            var kv = dataObj[zone === 1 ? "admin1Pwd" : "admin2Pwd"];
            if (kv && kv.length > 0) return kv;
            return zone === 1 ? PASSWORD1 : PASSWORD2;
        }

        function checkPassword() {
            var inputPassword = document.getElementById("passwordInput").value;
            var correctPassword = getEffectivePassword(currentZone);
            if (inputPassword === correctPassword) { hidePasswordPrompt(); showUpdateModal(); }
            else { document.getElementById("passwordError").textContent = "密码错误！"; }
        }

        document.getElementById("passwordInput").addEventListener("keypress", function(e){if(e.key==="Enter")checkPassword();});

        async function changePassword() {
            var np = document.getElementById("newPasswordInput").value;
            var msg = document.getElementById("pwdMsg");
            if (!np) { msg.textContent = "请输入新密码"; msg.style.color = "#ef5350"; return; }
            if (np.length < 4) { msg.textContent = "密码至少 4 位"; msg.style.color = "#ef5350"; return; }
            localStorage.setItem("admin" + currentZone + "Pwd", np);
            if (currentZone === 1) dataObj.admin1Pwd = np; else dataObj.admin2Pwd = np;
            await saveDataToStorage();
            msg.textContent = "密码已修改！下次登录请使用新密码。";
            msg.style.color = "#66bb6a";
            document.getElementById("newPasswordInput").value = "";
        }

        async function resetPassword() {
            localStorage.removeItem("admin" + currentZone + "Pwd");
            if (currentZone === 1) dataObj.admin1Pwd = ""; else dataObj.admin2Pwd = "";
            await saveDataToStorage();
            var msg = document.getElementById("pwdMsg");
            msg.textContent = "已恢复初始密码。";
            msg.style.color = "#66bb6a";
            document.getElementById("newPasswordInput").value = "";
        }

        function showUpdateModal() {
            var z1 = currentZone === 1;
            document.getElementById("updateModal").style.display = "block";
            document.getElementById("updateTitle").textContent = "Backend" + currentZone + " - 更新数据";
            document.getElementById("zone1Fields").style.display = z1 ? "block" : "none";
            document.getElementById("zone2Fields").style.display = z1 ? "none" : "block";
            document.getElementById("inputBackend1").value = (dataObj.backend1 || []).join("\n");
            document.getElementById("inputBackend2").value = (dataObj.backend2 || []).join("\n");
            document.getElementById("inputBackend3").value = (dataObj.backend3 || []).join("\n");
            document.getElementById("inputBackend4").value = (dataObj.backend4 || []).join("\n");
            document.getElementById("updateMsg").textContent = (z1 ? "上午更新上午 下午更新下午" : "上午更新上午 下午更新下午") + " 已载入，修改后保存即覆盖";
            document.getElementById("updateMsg").style.color = "rgba(255,255,255,0.5)";
        }

        function hideUpdateModal() { document.getElementById("updateModal").style.display = "none"; }

        async function clearBackend(n) {
            if (!confirm("确定要清除 backend" + n + " 吗？")) return;
            document.getElementById("inputBackend" + n).value = "";
            dataObj["backend" + n] = [];
            await saveDataToStorage();
            document.getElementById("updateMsg").textContent = "backend" + n + " 已清除！";
            document.getElementById("updateMsg").style.color = "#66bb6a";
        }

        function parseInput(input) {
            if (!input.trim()) return [];
            var lines = input.split('\n');
            var addHou = [];
            for (var i = 0; i < lines.length; i++) {
                addHou[i] = false;
                if (i + 1 < lines.length && lines[i+1].indexOf('厚') >= 0) { addHou[i] = true; }
            }
            var out = [];
            for (var i = 0; i < lines.length; i++) {
                var t = lines[i].trim();
                if (!t) continue;
                var lineHasHou = t.indexOf('厚') >= 0;
                var items = t.split(/[、。]+/);
                for (var ii = 0; ii < items.length; ii++) {
                    var item = items[ii].trim();
                    if (!item) continue;
                    var commaIdx = item.indexOf('，');
                    var suffix = '';
                    if (commaIdx >= 0) {
                        suffix = item.substring(commaIdx + 1).trim().replace(/[\u4e00-\u9fff]+/g, '');
                    }
                    var rawId = commaIdx >= 0 ? item.substring(0, commaIdx).trim() : item;
                    if (!rawId) continue;
                    if (!/[0-9A-Za-z]/.test(rawId)) continue;
                    var num;
                    if (/^[\u4e00-\u9fff]/.test(rawId)) {
                        var idNoChinese = rawId.replace(/[\u4e00-\u9fff]+/g, '');
                        var lm = idNoChinese.match(/^([A-Za-z]+)(.*)$/);
                        if (lm) { num = lm[2] || ''; }
                        if (!num) continue;
                    } else {
                        var m = rawId.match(/^([0-9A-Za-z]+)/);
                        if (!m) continue;
                        num = m[1];
                    }
                    if (suffix) {
                        out.push(num + '-' + suffix);
                    } else if (lineHasHou || item.indexOf('厚') >= 0 || addHou[i]) {
                        out.push(num + '-厚');
                    } else {
                        out.push(num);
                    }
                }
            }
            var seen = {}, fin = [];
            for (var ri = 0; ri < out.length; ri++) {
                if (!seen[out[ri]]) { seen[out[ri]] = true; fin.push(out[ri]); }
            }
            return fin;
        }

        async function saveArray() {
            var msgEl = document.getElementById("updateMsg");
            try {
                if (currentZone === 1) {
                    dataObj.backend1 = parseInput(document.getElementById("inputBackend1").value);
                    dataObj.backend2 = parseInput(document.getElementById("inputBackend2").value);
                } else {
                    dataObj.backend3 = parseInput(document.getElementById("inputBackend3").value);
                    dataObj.backend4 = parseInput(document.getElementById("inputBackend4").value);
                }
                await saveDataToStorage();
                var t = (dataObj.backend1||[]).length+(dataObj.backend2||[]).length+(dataObj.backend3||[]).length+(dataObj.backend4||[]).length;
                msgEl.textContent = "保存成功！共 " + t + " 条（b1:"+(dataObj.backend1||[]).length+" b2:"+(dataObj.backend2||[]).length+" b3:"+(dataObj.backend3||[]).length+" b4:"+(dataObj.backend4||[]).length+"）";
                msgEl.style.color = "#66bb6a";
                setTimeout(hideUpdateModal, 2000);
            } catch(e) {
                msgEl.textContent = "保存失败：" + e.message;
                msgEl.style.color = "#ef5350";
            }
        }
    </script>
</body>
</html>
