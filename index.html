<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;overflow-x:hidden}
body{background:#0f1923 url('assets/bg.jpg') center/cover fixed no-repeat;font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:#fff;position:relative;padding-top:80px}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(8,12,24,0.62),rgba(8,12,24,0.62));pointer-events:none;z-index:0}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate;opacity:0}
@keyframes twinkle{0%{opacity:0.1;transform:scale(0.8)}100%{opacity:var(--o);transform:scale(1)}}
.main-wrap{position:relative;z-index:2;width:100%;max-width:600px;padding:20px;text-align:center}
.logo{margin-bottom:24px}
.logo svg{width:80px;height:80px;filter:drop-shadow(0 0 20px rgba(255,205,140,0.55))}
.logo-text{margin-top:12px;font-size:18px;letter-spacing:6px;color:rgba(255,255,255,0.7);font-weight:300}
.search-box{position:relative;z-index:2;margin:0 auto 20px;width:90%;max-width:400px;background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:24px 20px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 40px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08)}
.search-box p{margin:0 0 10px;font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:2px}
input[type=password]{width:100%;padding:12px 0;font-size:18px;text-align:center;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.15);outline:none;color:#fff;letter-spacing:4px;transition:border-color .3s}
input[type=password]:focus{border-bottom-color:rgba(100,180,255,0.5)}
input[type=password]::placeholder{color:rgba(255,255,255,0.2);letter-spacing:1px}
.result{font-size:80px;font-weight:bold;margin-top:20px;height:100px;line-height:100px;letter-spacing:8px;text-shadow:0 0 30px currentColor;transition:all .3s}
.result.found{color:#4fc3f7}
.result.not-found{color:#ef5350}
.secret-zone{position:fixed;top:0;right:0;width:80px;height:80px;cursor:pointer;z-index:10}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:1000}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a2332;padding:30px;border-radius:12px;min-width:350px;max-width:90%;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal h2{margin-top:0;font-size:18px;color:#4fc3f7;font-weight:400}
.modal h3{margin:15px 0 5px;font-size:14px;color:rgba(255,255,255,0.6)}
.modal textarea{width:100%;height:120px;margin:5px 0;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;box-sizing:border-box}
.modal textarea:focus{outline:none;border-color:rgba(100,180,255,0.4)}
.modal input[type=password]{padding:8px;font-size:14px;width:200px;margin:10px 0;letter-spacing:1px}
.modal button{padding:8px 16px;font-size:14px;margin:5px;border:none;cursor:pointer;border-radius:6px;transition:all .2s}
.modal .btn-save{background:#4fc3f7;color:#000}.modal .btn-save:hover{background:#81d4fa}
.modal .btn-cancel{background:rgba(255,255,255,0.1);color:#fff}.modal .btn-cancel:hover{background:rgba(255,255,255,0.2)}
.modal .btn-confirm{background:#4fc3f7;color:#000}.modal .btn-confirm:hover{background:#81d4fa}
.modal .btn-clear{background:rgba(255,152,0,0.15);color:#ffb74d;border:1px solid rgba(255,152,0,0.3)}.modal .btn-clear:hover{background:rgba(255,152,0,0.25)}
.array-count{font-size:12px;color:rgba(255,255,255,0.35);margin-left:10px}
.error-msg{color:#ef5350;font-size:14px;margin-top:10px}
@media(max-width:600px){.result{font-size:60px;height:80px;line-height:80px}.modal{min-width:280px;padding:20px}.search-box{padding:20px 16px}.logo svg{width:60px;height:60px}.search-row{flex-wrap:nowrap;gap:8px}.search-row input[type=password]{width:auto;flex:1 1 0;min-width:0}}
/* ===== 新增：状态指示灯 + 清除按钮 ===== */
.status-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;font-size:13px;color:rgba(255,255,255,0.6);min-height:20px}
.status-dot{width:10px;height:10px;border-radius:50%}
.status-dot.loading{background:#ef5350;box-shadow:0 0 8px rgba(239,83,80,0.6)}
.status-dot.ready{background:#66bb6a;box-shadow:0 0 8px rgba(102,187,106,0.6)}
.status-dot.error{background:#ff9800;box-shadow:0 0 8px rgba(255,152,0,0.6)}
.search-row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:4px}
.search-row input[type=password]{width:200px;flex:0 0 auto}
.btn-clear-search{padding:10px 16px;font-size:14px;background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .2s;flex:0 0 auto}
.btn-clear-search:hover{background:rgba(79,195,247,0.25)}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="main-wrap">
<div class="logo">
<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" onclick="location.reload()" style="cursor:pointer" title="点击刷新">
<g stroke="#f3ead2" stroke-width="9" stroke-linecap="round">
<line x1="26" y1="74" x2="74" y2="26"/>
<line x1="26" y1="26" x2="74" y2="74"/>
</g>
<g fill="#f3ead2">
<circle cx="26" cy="74" r="7"/><circle cx="74" cy="26" r="7"/>
<circle cx="26" cy="26" r="7"/><circle cx="74" cy="74" r="7"/>
</g>
<path d="M50 18 C36 18 28 28 28 42 C28 52 33 58 38 62 L38 70 C38 73 41 75 44 75 L56 75 C59 75 62 73 62 70 L62 62 C67 58 72 52 72 42 C72 28 64 18 50 18 Z" fill="#f3ead2" stroke="#cbb78f" stroke-width="1.5"/>
<ellipse cx="41" cy="42" rx="8" ry="9" fill="#2a2030"/>
<ellipse cx="59" cy="42" rx="8" ry="9" fill="#2a2030"/>
<path d="M50 50 L45 58 L55 58 Z" fill="#2a2030"/>
<line x1="50" y1="64" x2="50" y2="75" stroke="#cbb78f" stroke-width="1.5"/>
<line x1="44" y1="64" x2="44" y2="75" stroke="#cbb78f" stroke-width="1.2"/>
<line x1="56" y1="64" x2="56" y2="75" stroke="#cbb78f" stroke-width="1.2"/>
</svg>
</div>
<div class="search-box">
<p>请输入网盘密码：</p>
<div class="search-row">
<input type="password" id="numberInput" placeholder="····" />
<button type="button" id="clearSearchBtn" class="btn-clear-search">清除</button>
</div>
</div>
<div class="status-line"><span id="statusDot" class="status-dot loading"></span><span id="statusText">数组加载中…</span></div>
<div id="result" class="result"></div>
</div>

<div class="secret-zone" onclick="showPasswordPrompt()"></div>

<div id="passwordModal" class="modal-overlay">
 <div class="modal">
 <h2>请输入密码</h2>
 <input type="password" id="passwordInput" placeholder="密码" /><br/>
 <button class="btn-confirm" onclick="checkPassword()">确认</button>
 <button class="btn-cancel" onclick="hidePasswordPrompt()">取消</button>
 <div id="passwordError" class="error-msg"></div>
 </div>
</div>

<div id="updateModal" class="modal-overlay">
 <div class="modal">
 <h2>管理数组数据</h2>
 <h3>主数组1 (frontend1-上午) <span id="countFrontend1" class="array-count"></span></h3>
 <textarea id="inputFrontend1" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearFrontend1()">一键清除 frontend1</button>

 <h3>主数组2 (frontend2-下午) <span id="countFrontend2" class="array-count"></span></h3>
 <textarea id="inputFrontend2" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearFrontend2()">一键清除 frontend2</button>

 <h3>后台数组1 (backend1-上午) <span id="countBackend1" class="array-count"></span></h3>
 <textarea id="inputBackend1" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearBackend1()">一键清除 backend1</button>

 <h3>后台数组2 (backend2-下午) <span id="countBackend2" class="array-count"></span></h3>
 <textarea id="inputBackend2" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearBackend2()">一键清除 backend2</button>

 <h3>后台数组3 (backend3-上午) <span id="countBackend3" class="array-count"></span></h3>
 <textarea id="inputBackend3" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearBackend3()">一键清除 backend3</button>

 <h3>后台数组4 (backend4-下午) <span id="countBackend4" class="array-count"></span></h3>
 <textarea id="inputBackend4" placeholder="每行一个编号"></textarea>
 <button class="btn-clear" onclick="clearBackend4()">一键清除 backend4</button>

 <div style="margin-top:15px">
 <button class="btn-save" onclick="saveAllArrays()">保存全部</button>
 <button class="btn-cancel" onclick="hideUpdateModal()">取消</button>
 </div>
 <div id="updateMsg" class="error-msg"></div>
 </div>
</div>

<script>(function(){var c=document.getElementById('stars');for(var i=0;i<60;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2+1;s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(Math.random()*3+2)+'s;--o:'+(Math.random()*0.5+0.3)+';animation-delay:'+Math.random()*3+'s';c.appendChild(s);}})();var PASSWORD = String.fromCharCode(119,111,97,105,110,105,109,109);var dataObj ={frontend:[],frontend1:[],frontend2:[],backend1:[],backend2:[],backend3:[],backend4:[]};var numbersArray = [];var searchCounts = {};var searchCountsDirty = false;function setStatus(state){var dot=document.getElementById("statusDot");var txt=document.getElementById("statusText");if(!dot||!txt)return;dot.className="status-dot "+state;if(state==='ready'){txt.textContent="数据已加载成功";}else if(state==='loading'){txt.textContent="数组加载中…";}else{txt.textContent="数组加载失败，请刷新";}}function clearSearch(){var inp=document.getElementById("numberInput");inp.value="";var r=document.getElementById("result");r.className="result";r.textContent="";inp.focus();}async function loadArray(){setStatus('loading');try{var resp = await fetch("/api/data");if(resp.ok){dataObj = await resp.json();searchCounts = dataObj.searchCounts || {};numbersArray = (dataObj.frontend||[]).concat(dataObj.frontend1||[],dataObj.frontend2||[],dataObj.backend1||[],dataObj.backend2||[],dataObj.backend3||[],dataObj.backend4||[]);setStatus('ready');}else{setStatus('error');}}catch(e){dataObj ={frontend:[],frontend1:[],frontend2:[],backend1:[],backend2:[],backend3:[],backend4:[]};searchCounts = {};numbersArray = [];setStatus('error');}}async function saveAllArraysToStorage(){console.log("POSTing:",JSON.stringify(dataObj));var payload = JSON.stringify(dataObj);if(searchCountsDirty){payload = JSON.stringify({frontend:dataObj.frontend,frontend1:dataObj.frontend1,frontend2:dataObj.frontend2,backend1:dataObj.backend1,backend2:dataObj.backend2,backend3:dataObj.backend3,backend4:dataObj.backend4,admin1Pwd:dataObj.admin1Pwd,admin2Pwd:dataObj.admin2Pwd,searchCounts:searchCounts});}var r=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:payload});console.log("Response status:",r.status);var t=await r.text();console.log("Response body:",t);if(!r.ok){throw new Error("服务器返回"+r.status+": "+t);}}loadArray();var debounceTimer = null;function checkNumber(){var n = document.getElementById("numberInput").value.trim();var r = document.getElementById("result");if(!n){r.className="result";r.textContent="";return;}var matchWithSuffix = null,matchNumberOnly = null,matchSource = null;for(var i = 0;i < numbersArray.length;i++){var item = numbersArray[i];var parts = item.split('-');var numPart = parts[0],hasSuffix = parts.length > 1;if(numPart === n || item === n){if(hasSuffix){matchWithSuffix = item;matchSource = item;break;}else if(!matchNumberOnly){matchNumberOnly = item;matchSource = item;}}}if(matchWithSuffix){r.className="result found";r.textContent="👌👌";}else if(matchNumberOnly){r.className="result found";r.textContent="👌";}else{r.className="result not-found";r.textContent="😭";return;}if(matchSource && (dataObj.frontend1.indexOf(matchSource)>=0 || dataObj.frontend2.indexOf(matchSource)>=0)){var key = matchSource;if(!searchCounts[key])searchCounts[key] = 0;searchCounts[key]++;searchCountsDirty = true;var idx1 = dataObj.frontend1.indexOf(matchSource);var idx2 = dataObj.frontend2.indexOf(matchSource);if(searchCounts[key] >= 3){if(idx1 >= 0){dataObj.frontend1.splice(idx1,1);numbersArray = (dataObj.frontend||[]).concat(dataObj.frontend1||[],dataObj.frontend2||[],dataObj.backend1||[],dataObj.backend2||[],dataObj.backend3||[],dataObj.backend4||[]);delete searchCounts[key];}else if(idx2 >= 0){dataObj.frontend2.splice(idx2,1);numbersArray = (dataObj.frontend||[]).concat(dataObj.frontend1||[],dataObj.frontend2||[],dataObj.backend1||[],dataObj.backend2||[],dataObj.backend3||[],dataObj.backend4||[]);delete searchCounts[key];}saveAllArraysToStorage();}}}document.getElementById("numberInput").addEventListener("input",function(){clearTimeout(debounceTimer);debounceTimer=setTimeout(checkNumber,500);});document.getElementById("numberInput").addEventListener("keypress",function(e){if(e.key==="Enter"){clearTimeout(debounceTimer);checkNumber();}});document.getElementById("clearSearchBtn").addEventListener("click",clearSearch);function showPasswordPrompt(){var m=document.getElementById("passwordModal");m.style.display="block";document.getElementById("passwordInput").value="";document.getElementById("passwordError").textContent="";document.getElementById("passwordInput").focus();}function hidePasswordPrompt(){document.getElementById("passwordModal").style.display="none";}function checkPassword(){if(document.getElementById("passwordInput").value===PASSWORD){hidePasswordPrompt();showUpdateModal();}else{document.getElementById("passwordError").textContent="密码错误！";}}document.getElementById("passwordInput").addEventListener("keypress",function(e){if(e.key==="Enter")checkPassword();});function parseInput(input){if(!input.trim())return[];var lines=input.split('\n');var addHou=[];for(var i=0;i<lines.length;i++){addHou[i]=false;if(i+1<lines.length && lines[i+1].indexOf('厚')>=0){addHou[i]=true}}var out=[];for(var i=0;i<lines.length;i++){var t=lines[i].trim();if(!t)continue;var lineHasHou=t.indexOf('厚')>=0;var items=t.split(/[、。]+/);for(var ii=0;ii<items.length;ii++){var item=items[ii].trim();if(!item)continue;var commaIdx=item.indexOf('，');var suffix='';if(commaIdx>=0){suffix=item.substring(commaIdx+1).trim().replace(/[\u4e00-\u9fff]+/g,'');}var rawId=commaIdx>=0?item.substring(0,commaIdx).trim():item;if(!rawId)continue;if(!/[0-9A-Za-z]/.test(rawId))continue;var num;if(/^[\u4e00-\u9fff]/.test(rawId)){var idNoChinese=rawId.replace(/[\u4e00-\u9fff]+/g,'');var lm=idNoChinese.match(/^([A-Za-z]+)(.*)$/);if(lm){num=lm[2]||''}if(!num)continue;}else{var m=rawId.match(/^([0-9A-Za-z]+)/);if(!m)continue;num=m[1];}if(suffix){out.push(num+'-'+suffix);}else if(lineHasHou || item.indexOf('厚')>=0 || addHou[i]){out.push(num+'-厚');}else{out.push(num);}}}var seen={},fin=[];for(var ri=0;ri<out.length;ri++){if(!seen[out[ri]]){seen[out[ri]]=true;fin.push(out[ri])}}return fin}function showUpdateModal(){document.getElementById("updateModal").style.display="block";document.getElementById("inputFrontend1").value=(dataObj.frontend1||[]).join("\n");document.getElementById("inputFrontend2").value=(dataObj.frontend2||[]).join("\n");document.getElementById("inputBackend1").value=(dataObj.backend1||[]).join("\n");document.getElementById("inputBackend2").value=(dataObj.backend2||[]).join("\n");document.getElementById("inputBackend3").value=(dataObj.backend3||[]).join("\n");document.getElementById("inputBackend4").value=(dataObj.backend4||[]).join("\n");document.getElementById("countFrontend1").textContent="("+(dataObj.frontend1||[]).length+" 条已有)";document.getElementById("countFrontend2").textContent="("+(dataObj.frontend2||[]).length+" 条已有)";document.getElementById("countBackend1").textContent="("+(dataObj.backend1||[]).length+" 条已有)";document.getElementById("countBackend2").textContent="("+(dataObj.backend2||[]).length+" 条已有)";document.getElementById("countBackend3").textContent="("+(dataObj.backend3||[]).length+" 条已有)";document.getElementById("countBackend4").textContent="("+(dataObj.backend4||[]).length+" 条已有)";document.getElementById("updateMsg").textContent="修改内容后保存即覆盖，空白则清空";document.getElementById("updateMsg").style.color="rgba(255,255,255,0.4)";}function updateCounts(){var fe1=(dataObj.frontend1||[]).length;var fe2=(dataObj.frontend2||[]).length;var b1=(dataObj.backend1||[]).length;var b2=(dataObj.backend2||[]).length;var b3=(dataObj.backend3||[]).length;var b4=(dataObj.backend4||[]).length;document.getElementById("countFrontend1").textContent="("+fe1+" 条已有)";document.getElementById("countFrontend2").textContent="("+fe2+" 条已有)";document.getElementById("countBackend1").textContent="("+b1+" 条已有)";document.getElementById("countBackend2").textContent="("+b2+" 条已有)";document.getElementById("countBackend3").textContent="("+b3+" 条已有)";document.getElementById("countBackend4").textContent="("+b4+" 条已有)";}document.getElementById("inputFrontend1").addEventListener("input",updateCounts);document.getElementById("inputFrontend2").addEventListener("input",updateCounts);document.getElementById("inputBackend1").addEventListener("input",updateCounts);document.getElementById("inputBackend2").addEventListener("input",updateCounts);document.getElementById("inputBackend3").addEventListener("input",updateCounts);document.getElementById("inputBackend4").addEventListener("input",updateCounts);function hideUpdateModal(){document.getElementById("updateModal").style.display="none";}async function clearFrontend1(){if(confirm("确定要清除 frontend1 吗？")){document.getElementById("inputFrontend1").value="";dataObj.frontend1=[];updateCounts();await saveAllArraysToStorage();}}
async function clearFrontend2(){if(confirm("确定要清除 frontend2 吗？")){document.getElementById("inputFrontend2").value="";dataObj.frontend2=[];updateCounts();await saveAllArraysToStorage();}}async function clearBackend1(){if(confirm("确定要清除 backend1 吗？")){document.getElementById("inputBackend1").value="";dataObj.backend1=[];updateCounts();await saveAllArraysToStorage();}}async function clearBackend2(){if(confirm("确定要清除 backend2 吗？")){document.getElementById("inputBackend2").value="";dataObj.backend2=[];updateCounts();await saveAllArraysToStorage();}}
async function clearBackend3(){if(confirm("确定要清除 backend3 吗？")){document.getElementById("inputBackend3").value="";dataObj.backend3=[];updateCounts();await saveAllArraysToStorage();}}
async function clearBackend4(){if(confirm("确定要清除 backend4 吗？")){document.getElementById("inputBackend4").value="";dataObj.backend4=[];updateCounts();await saveAllArraysToStorage();}}async function saveAllArrays(){var msgEl=document.getElementById("updateMsg");try{var fe1=parseInput(document.getElementById("inputFrontend1").value);var fe2=parseInput(document.getElementById("inputFrontend2").value);var b1=parseInput(document.getElementById("inputBackend1").value);var b2=parseInput(document.getElementById("inputBackend2").value);var b3=parseInput(document.getElementById("inputBackend3").value);var b4=parseInput(document.getElementById("inputBackend4").value);dataObj.frontend1=fe1;dataObj.frontend2=fe2;dataObj.backend1=b1;dataObj.backend2=b2;dataObj.backend3=b3;dataObj.backend4=b4;await saveAllArraysToStorage();numbersArray=fe1.concat(fe2,b1,b2,b3,b4);msgEl.textContent="保存成功！共"+numbersArray.length+"条数据。";msgEl.style.color="#4fc3f7";setTimeout(hideUpdateModal,2000);}catch(e){msgEl.textContent="保存失败："+e.message;msgEl.style.color="#ef5350";}}</script>
</body>
</html>
